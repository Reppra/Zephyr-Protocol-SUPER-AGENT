  [x, y, z, vx, vy, vz, glyph] at i*28, MAX=48000, RESERVE=256,
  SLOTBASE=47744, TARGET_MAX=47744.

  Known kernel defects (measured, documented): bulk3d divides dtMs by 1000
  in i32 so it moves NOTHING for dt<1000 ms, and caps speed at 1040 fixed
  (~1 px/s) instead of VMAX=560*FIX. The library therefore exposes bulk3d as

  corrected JS integrator that runs the same attractor/wind/damp/clamp/bounce

/*-----------------------------------------------------------------------------
  Constants (from PURE_ENGINE_010.html layout, lines 145-153)
-----------------------------------------------------------------------------*/
const FIX   = 1024;
const VMAX  = 560 * FIX;
const MAX   = 48000;
const RESERVE = 256;
const SLOTBASE = MAX - RESERVE;   // 47744
const TARGET_MAX = SLOTBASE;

const PARI  = 336000;   // organism params 28B x72
const TRI   = 336504;   // trig 32B x72
const SCRI  = 337080;   // scratch 16B x48000 (proj output)
const ORI   = 529080;   // order 4B x48000

const FOV        = 65;
const CAM_NEAR   = 90 * FIX;
const CAM_FAR    = 6000 * FIX;
const SORT_BUCKETS = 64;

/*-----------------------------------------------------------------------------
  Instantiate kernel
-----------------------------------------------------------------------------*/
let wasm, mem, forms, order, ready = false, bootLog = [], kernelBytes = 0;
let bootError = null;   // A1: boot failure is data, not a throw at import time
function blog(s){ bootLog.push(s); if(bootLog.length>8) bootLog.shift(); }

/* F1: TypedArray views over mem.buffer detach when the kernel grows its
   memory. Re-create views whenever the backing buffer changes. Returns
   true if views were refreshed. */
function refreshViews(){
  if(!mem) return false;
  const buf = mem.buffer;
  if(forms && forms.buffer === buf && forms.byteLength === buf.byteLength) return false;
  forms = new Int32Array(buf);
  order = new Int32Array(buf);   // shared view, order lives at ORI
  return true;
}

/* Fixed-point divide (item 4, JS equivalent of FDIV): (a<<10)/b with a
   zero-divisor guard. FIX=1024 (10-bit), so a*FIX stays within 2^53. */
function fdiv(a, b){
  a |= 0; b |= 0;
  if(b === 0) return 0;
  const q = Math.trunc((a * FIX) / b);
  return Math.max(-2147483648, Math.min(2147483647, q)) | 0;
}

function createEngine(){
  const bytes = new Uint8Array(atob(KERNEL_B64).split('').map(c=>c.charCodeAt(0)));
  kernelBytes = bytes.length;
  const mod = new WebAssembly.Module(bytes);          // validates
  const inst = new WebAssembly.Instance(mod);         // 0 imports
  wasm = inst.exports;
  mem  = wasm.mem;
  forms = null; order = null;   // refreshViews() (re)creates both views
  refreshViews();
  ready = true;
  bootError = null;
  blog('module built: ' + bytes.length + ' bytes');
  blog('wasm instantiated ok: mem=' + mem.buffer.byteLength + 'B exports=' +
       Object.keys(wasm).join(','));
  return wasm;
}

/*-----------------------------------------------------------------------------
  Legacy kernel exports (documented defects: see step())
-----------------------------------------------------------------------------*/
function xdraw(slot,x,y,z,vx,vy,vz,glyph){
  if(!ready) createEngine();
  return wasm.xdraw(slot|0,x|0,y|0,z|0,vx|0,vy|0,vz|0,glyph|0);
}
/* bulk3d: kept exported but NOT the supported integrator. dtMs/1000 i32
   division freezes all motion for dt<1000 ms; speed cap is 1040 not VMAX. */
function bulk3d(n,attX,attY,attZ,wX,wY,wZ,W,H,ZS3,dampFP,dtMs){
  if(!ready) createEngine();
  return wasm.bulk3d(n|0,attX|0,attY|0,attZ|0,wX|0,wY|0,wZ|0,W|0,H|0,ZS3|0,dampFP|0,dtMs|0);
}
function bulkOrg3d(n,W,H,ZS3,floorY,dtMs){
  if(!ready) createEngine();
  return wasm.bulkOrg3d(n|0,W|0,H|0,ZS3|0,floorY|0,dtMs|0);
}
function proj(n,camX,camY,camZ,cY,sY,cP,sP,focal,W2,H2,near,sizeFloor){
  if(!ready) createEngine(); else refreshViews();
  wasm.proj(n|0,camX|0,camY|0,camZ|0,cY|0,sY|0,cP|0,sP|0,focal|0,W2|0,H2|0,near|0,sizeFloor|0);
}
/* sort: stable counting sort ASCENDING by camera depth. Writes only the first
   vis entries of order[]; the TAIL is left stale â€” callers must read only
   order[0, vis). Returns vis. */
function sort(n,buckets,far){
  if(!ready) createEngine(); else refreshViews();
  wasm.sort(n|0,buckets|0,far|0);
  let vis=0;
  for(let i=0;i<Math.max(0,n|0);i++){
    if(forms[SCRI+i*4+3] > 0) vis++;
  }
  return vis;
}

/*-----------------------------------------------------------------------------
  projRef: JS reference bit-exact with the kernel proj() (verified 200k cases).
  Ground truth from bytecode decode:
    x1 = ((dx>>2)*cY - (dz>>2)*sY) >> 8
    z1 = ((dx>>2)*sY + (dz>>2)*cY) >> 8
    y2 = ((dy>>2)*cP - (z1>>2)*sP) >> 8
    z2 = ((dy>>2)*sP + (z1>>2)*cP) >> 8
    cull if z2 < near
    sx = trunc( f32(x1)*f32(focal)/f32(z2) + f32(W2) )
    sy = trunc( f32(H2) - f32(y2)*f32(focal)/f32(z2) )
    size = clamp( trunc( f32(ss)*f32(focal)/f32(z2) ), 1, 8 )
    scratch write: [sx*1024, sy*1024, size, z2]
-----------------------------------------------------------------------------*/
function refProj(xi,yi,zi,cam){
  const dx=(xi-cam.x)|0, dy=(yi-cam.y)|0, dz=(zi-cam.z)|0;
  const x1=(Math.imul(dx>>2,cam.cY)-Math.imul(dz>>2,cam.sY))>>8;
  const z1=(Math.imul(dx>>2,cam.sY)+Math.imul(dz>>2,cam.cY))>>8;
  const y2=(Math.imul(dy>>2,cam.cP)-Math.imul(z1>>2,cam.sP))>>8;
  const z2=(Math.imul(dy>>2,cam.sP)+Math.imul(z1>>2,cam.cP))>>8;
  if(z2<cam.near) return {ok:0,sx:0,sy:0,s:0,b:0,z2:0};
  const fz=Math.fround(z2);
  const sx=Math.trunc(Math.fround(Math.fround(Math.fround(Math.fround(x1)*cam.focal)/fz)+cam.W2));
  const sy=Math.trunc(Math.fround(cam.H2-Math.fround(Math.fround(y2)*cam.focal)/fz));
  let s=Math.trunc(Math.fround(Math.fround(cam.ss)*cam.focal/fz));
  if(s<1)s=1; if(s>8)s=8;
  return {ok:1,sx,sy,s:s|0,b:255-Math.min(255,z2>>15),z2};
}

/*-----------------------------------------------------------------------------
  projSort: one wasm proj() call + one wasm sort() call, returns vis count.
  Painter must iterate order[0,vis) descending (far first) â€” sort is
  ascending by depth, so farthest is LAST. Kernel writes only vis entries;
  tail of order[] is stale.
-----------------------------------------------------------------------------*/
function projSort(n,camX,camY,camZ,cY,sY,cP,sP,focal,W2,H2,near,sizeFloor,buckets,far){
  proj(n,camX,camY,camZ,cY,sY,cP,sP,focal,W2,H2,near,sizeFloor);
  const n2 = sort(n,buckets,far);
  // kernel does not expose vis; recompute from scratch depth field
  let vis=0;
  for(let i=0;i<n;i++){
    const p=SCRI+i*4;
    if(forms[p+3]>0) vis++;
  }
  return vis;
}

/*-----------------------------------------------------------------------------
  step(): corrected integrator. Same physics intent as bulk3d
  (attractor swirl + wind + damping + speed clamp + box bounce) but:
    * dtMs used as a REAL fraction (dtMs/1000) â€” no i32 /1000 freeze
    * integer fixed-point throughout, no float stored into Int32Array
    * speed clamp at VMAX=560*FIX (not the kernel's 1040)
  Returns nothing; mutates forms[] in place. One JS sweep, zero wasm crossings.
-----------------------------------------------------------------------------*/
function step(n,attX,attY,attZ,wX,wY,wZ,W,H,ZS3,dampFP,dtMs){
  if(!ready) createEngine(); else refreshViews();
  const f = dtMs / 1000;                 // real fraction
  const ACC = 160, SWL = 110, DMIN = 64;
  const VM2 = VMAX * VMAX;
  for(let i=0;i<n;i++){
    const b=i*7;
    const dx = attX - forms[b];
    const dy = attY - forms[b+1];
    const dz = attZ - forms[b+2];
    let d = Math.sqrt(dx*dx + dy*dy + dz*dz);
    if(d < DMIN) d = DMIN;
    const r = ACC * f / d;
    const sw = SWL * f / d;
    let vx = forms[b+3] + wX + dx*r - dy*sw;
    let vy = forms[b+4] + wY + dy*r + dx*sw;
    let vz = forms[b+5] + wZ + dz*r;
    const v2 = vx*vx + vy*vy + vz*vz;
    if(v2 > VM2){
      const m = VMAX / Math.sqrt(v2);
      vx *= m; vy *= m; vz *= m;
    }
    // damping: v *= damp/1024
    vx = (vx * dampFP) / 1024 | 0;
    vy = (vy * dampFP) / 1024 | 0;
    vz = (vz * dampFP) / 1024 | 0;
    forms[b+3] = vx;
    forms[b+4] = vy;
    forms[b+5] = vz;
    forms[b]   += Math.round(vx * f);
    forms[b+1] += Math.round(vy * f);
    forms[b+2] += Math.round(vz * f);
    // box clamp + bounce
    if(forms[b] < 0){ forms[b] = 0; forms[b+3] = -forms[b+3]; }
    else if(forms[b] > W){ forms[b] = W; forms[b+3] = -forms[b+3]; }
    if(forms[b+1] < 0){ forms[b+1] = 0; forms[b+4] = -forms[b+4]; }
    else if(forms[b+1] > H){ forms[b+1] = H; forms[b+4] = -forms[b+4]; }
    if(forms[b+2] < 0){ forms[b+2] = 0; forms[b+5] = -forms[b+5]; }
    else if(forms[b+2] > ZS3){ forms[b+2] = ZS3; forms[b+5] = -forms[b+5]; }
  }
}

/*-----------------------------------------------------------------------------
  OPUS 5.5 absorption â€” modular pure-JS algorithm ports.
  Kernel is sha-pinned (14062C24...2AE5B0A) and takes no new exports;
  wasm linear memory is fully allocated (records 0â€“1,344,000B,
  SCRI 1,348,320â€“2,116,320B, ORI 2,116,320â€“2,308,320B, ~313KB free).
  All new functions are pure JS,
  zero wasm crossings, no DOM, no WebGL, no fetch.
-----------------------------------------------------------------------------*/

function lerp(a, b, t){ return a + (b - a) * t; }

/*-----------------------------------------------------------------------------
  hash2: OPUS 5.5 $hash port â€” imul/xor/shr_u integer hash.
  Constants 374761393, 668265263, 1274126177; shifts 13 and 16.
  All i32 arithmetic via Math.imul + |0 wraparound.
-----------------------------------------------------------------------------*/
function hash2(a, b){
  a |= 0; b |= 0;
  let n = (Math.imul(a, 374761393) + Math.imul(b, 668265263)) | 0;
  n = (Math.imul(n ^ (n >>> 13), 1274126177)) | 0;
  return n ^ (n >>> 16);
}

/*-----------------------------------------------------------------------------
  rnd2: OPUS 5.5 $rnd port â€” float [0,1) from hash2.
  ((hash >>> 8) & 0xFFFF) / 65535.0
-----------------------------------------------------------------------------*/
function rnd2(a, b){
  a |= 0; b |= 0;
  const h = hash2(a, b);
  return ((h >>> 8) & 0xFFFF) / 65535.0;
}

/*-----------------------------------------------------------------------------
  noise2d: OPUS 5.5 $vn port â€” 2D value noise with bilinear lerp.
  Uses floor/frac/lerp/rnd2 grid-corner interpolation.
-----------------------------------------------------------------------------*/
function noise2d(x, z){
  x = +x; z = +z;
  const ix = Math.floor(x) | 0;
  const iz = Math.floor(z) | 0;
  let fx = x - Math.floor(x);
  let fz = z - Math.floor(z);
  fx = fx * fx * (3.0 - 2.0 * fx);
  fz = fz * fz * (3.0 - 2.0 * fz);
  const a = lerp(rnd2(ix, iz), rnd2(ix + 1, iz), fx);
  const b = lerp(rnd2(ix, iz + 1), rnd2(ix + 1, iz + 1), fx);
  return lerp(a, b, fz);
}

/*-----------------------------------------------------------------------------
  fbm2d: OPUS 5.5 $fbm port â€” fractal brownian motion over noise2d.
  Default 4 octaves: amplitude 0.5, frequency 0.03125, octave offset 31.7,
  normalised by 0.9375 (sum of 0.5 + 0.25 + 0.125 + 0.0625).
-----------------------------------------------------------------------------*/
function fbm2d(x, z, octaves){
  x = +x; z = +z;
  octaves = octaves | 0;
  if(octaves <= 0) return 0;
  let a = 0.5, f = 0.03125, o = 0.0, s = 0.0;
  for(let i = 0; i < octaves; i++){
    s += a * noise2d(x * f + o, z * f + o);
    f *= 2.0;
    a *= 0.5;
    o += 31.7;
  }
  return s / 0.9375;
}

/*-----------------------------------------------------------------------------
  Ring statistics (Qwen ringSample absorbed): rolling p50/p99/1%-low frame times
-----------------------------------------------------------------------------*/
const RING = new Float32Array(256); let rLen=0, rIdx=0;
function ringPush(ms){
  RING[rIdx++ & 255] = ms;
  if(rLen < 256) rLen++;
}
function ringStats(){
  if(rLen===0) return {p50:0,p99:0,p1low:0,count:0};
  const w = new Float32Array(rLen);
  for(let i=0;i<rLen;i++) w[i]=RING[(rIdx-rLen+i)&255];
  w.sort((a,b)=>a-b);
  const p50 = w[(rLen/2)|0];
  const p99 = w[Math.min(rLen-1, Math.floor(rLen*0.99))];
  const p1low = w[Math.max(0, Math.floor(rLen*0.01))];
  return {p50, p99, p1low, count: rLen};
}

/*-----------------------------------------------------------------------------
  Adaptive resolution governor (CANVAS_V8_KNOWLEDGE_005 Â§5):
  DPR ladder [1,1.5,2], slowEma-driven, standby-only, locked during runs.
-----------------------------------------------------------------------------*/
const RESLEVELS = [1, 1.5, 2];
function makeGovernor(){
  let resLvl = RESLEVELS.length - 1;
  let frameEma = 16.67, slowEma = 0, locked = false;
  return {
    setLocked(v){ locked = !!v; },
    update(dt){
      frameEma = frameEma*0.95 + dt*0.05;
      const over = dt > 1.25 * 16.67 ? 1 : 0;
      slowEma = slowEma*0.9 + over*0.1;
      if(!locked){
        if(slowEma > 0.5 && resLvl > 0) resLvl--;
        else if(slowEma < 0.1 && resLvl < RESLEVELS.length-1) resLvl++;
      }
      return RESLEVELS[resLvl];
    },
    level(){ return RESLEVELS[resLvl]; },
    locked(){ return locked; }
  };
}

/* Case-insensitive all-token search over section titles, ids, tags and points. */
function searchWasmKnowledge(query){
  const words = String(query).toLowerCase().trim().split(/\s+/).filter(Boolean);
  return sections.filter(section => {
    const text = [section.id, section.title, ...section.tags, ...section.points].join(' ').toLowerCase();

  });
}

/* Inspect a compiled core module. Compilation may require engine resources. */
function inspectWasmBytes(bytes){
  let valid = false;
  let imports = [];
  let exports_ = [];
  try {
    const mod = new WebAssembly.Module(bytes);
    valid = true;
    imports = WebAssembly.Module.imports(mod).map(e => ({ name: e.name, kind: e.kind }));
    exports_ = WebAssembly.Module.exports(mod).map(e => ({ name: e.name, kind: e.kind }));
  } catch (e) {
    // invalid bytes: valid stays false, imports/exports stay empty (A1: data, not throw)
  }
  return { valid, imports, exports: exports_ };
}

/* Safe, tiny, offline arithmetic example. Inline Wasm bytes equivalent to
   (module (func (export "add") (param i32 i32) (result i32)
   local.get 0 local.get 1 i32.add)). No imports, I/O or background work. */
function runWasmSmokeTest(){
  const bytes = new Uint8Array([
    0x00,0x61,0x73,0x6d,0x01,0x00,0x00,0x00,
    0x01,0x07,0x01,0x60,0x02,0x7f,0x7f,0x01,0x7f,
    0x03,0x02,0x01,0x00,
    0x07,0x07,0x01,0x03,0x61,0x64,0x64,0x00,0x00,
    0x0a,0x09,0x01,0x07,0x00,0x20,0x00,0x20,0x01,0x6a,0x0b
  ]);
  const mod = new WebAssembly.Module(bytes);
  const inst = new WebAssembly.Instance(mod, {});
  const result = inst.exports.add(20, 22);
  if (result !== 42) throw new Error('Unexpected Wasm result: ' + result);
  return { ok: true, operation: 'i32.add', inputs: [20, 22], result };
}

/*-----------------------------------------------------------------------------

  refProj, sort order == [1,0,2]; returns "OK" or "FAIL(n)".

function selfTest(){
  if(!ready) createEngine(); else refreshViews();
  let fail = 0;
  // three records at known depths
  setRec(0, 0, 0, 1500*FIX, 0,0,0, 0);
  setRec(1, 0, 0, 1000*FIX, 0,0,0, 1);
  setRec(2, 0, 0, 2000*FIX, 0,0,0, 2);
  const cam = {x:0,y:0,z:-1500*FIX,cY:1024,sY:0,cP:1024,sP:0,
               focal:848, W2:960, H2:540, near:CAM_NEAR, ss:2};
  const n = projSort(3, 0,0,-1500*FIX, 1024,0,1024,0, 848,960,540,CAM_NEAR,2, SORT_BUCKETS, CAM_FAR);
  if(n !== 3) fail = 1;
  for(let i=0;i<3 && !fail;i++){
    const r = refProj(0,0,[1500*FIX,1000*FIX,2000*FIX][i], cam);
    const p = SCRI + i*4;
    if(forms[p]   !== r.sx) fail = 3;
    if(forms[p+1] !== r.sy) fail = 4;
    if(forms[p+2] !== r.s)      fail = 5;
    if(forms[p+3] !== r.z2)     fail = 6;
  }
  // sort ascending by depth: order should be [1(1000), 0(1500), 2(2000)]
  // order[] is at ORI; sort wrote ascending depth => index 0 = nearest = rec1
  if(!fail){
    const want = [1,0,2];
    for(let i=0;i<3;i++){
      if(order[ORI + i] !== want[i]){ fail = 7; break; }
    }
  }
  return fail===0 ? 'OK' : 'FAIL('+fail+')';
}

/* classifyWasmError: debugging failure taxonomy, total function.
   compile/link/runtime -> CompileError/LinkError/RuntimeError; unknown -> other.
   Never throws; returns {cls, name, message} as data. */
function classifyWasmError(err){
  if(!err) return { cls: 'unknown', name: null, message: null };
  const name = err.name ? String(err.name) : '';
  const message = err.message ? String(err.message) : '';
  if(name === 'CompileError')  return { cls: 'compile',  name, message };
  if(name === 'LinkError')     return { cls: 'link',     name, message };
  if(name === 'RuntimeError')  return { cls: 'runtime',  name, message };
  return { cls: 'unknown', name, message };
}

/* instantiateWasmBytes: pipeline/js-api as executable code. Sync Module +
   Instance construction; caller supplies bytes (URL loader excluded:
   no-fetch contract). Hazards: start function may run at instantiation;
   imports are the guest attack surface. Returns {ok, module, instance,
   exports} or {ok:false, error} as data. */
function instantiateWasmBytes(bytes, imports){
  imports = imports || {};
  try {
    const mod = new WebAssembly.Module(bytes);
    const inst = new WebAssembly.Instance(mod, imports);
    return { ok: true, module: mod, instance: inst,
      exports: Object.keys(inst.exports).sort() };
  } catch (e) {
    return { ok: false, error: classifyWasmError(e) };
  }
}

/* readWasmSections: binary-format section as byte-level inspection; never
   instantiates (inspection that instantiates is not harmless). Core binary:
   magic 00 61 73 6d + version field, sections walked with an internal LEB128
   u32 reader (guarded to 5 bytes; more -> 'leb128'). Truncated ->
   'truncated section'; id 0 -> 'custom'; id > 12 -> 'unknown'. Returns
   {ok, magic, version, bytesLength, sections:[{id,name,size,offset}]} or
   {ok:false, reason} as data. */
function readWasmSections(bytes){
  let buf;
  try { buf = new Uint8Array(bytes); } catch(e){ return { ok:false, reason: 'not bytes' }; }
  const names = ['custom','type','import','function','table','memory','global','export','start','element','code','data','datacount'];
  let p = 0;
  function leb(){
    let r = 0, s = 0;
    for(let k = 0; k < 5; k++){

  function v3sub(a,b){

    if (y >= 48) return { ok: 0, error: null };
    if (x < 0 || x >= 64) return { ok: 1, error: null };
    if (z < 0 || z >= 64) return { ok: 1, error: null };
    return { ok: arenaU8[x + (z << 6) + (y << 12)] !== 0 ? 1 : 0, error: null };
  }

  /* ---- greedy mesh (A1_total) ---- */
  const FACES = [
    { n: [ 1, 0, 0], c: [1, 3, 7, 5] },
    { n: [-1, 0, 0], c: [0, 4, 6, 2] },
    { n: [ 0, 1, 0], c: [2, 6, 7, 3] },
    { n: [ 0,-1, 0], c: [0, 1, 5, 4] },
    { n: [ 0, 0, 1], c: [4, 5, 7, 6] },
    { n: [ 0, 0,-1], c: [0, 2, 3, 1] }
  ];
  const PLANE_AXES = [ [1,2], [2,0], [0,1] ];
  const AO_CURVE = [0.42, 0.62, 0.82, 1.0];
  const VERT_FLOATS = 10;
  let vertexData = null;
  let quadIndexData = null;
  let quadCount = 0;

  function cornerCode(cc){
    return { ok: [cc & 1, (cc >> 1) & 1, (cc >> 2) & 1], error: null };
  }
  function aoLevel(wx, wy, wz, f, ci){
    const face = FACES[f];
    const n = face.n;
    const co = cornerCode(face.c[ci]).ok;
    const nx = cornerCode(face.c[(ci+1) % 4]).ok[0] - co[0];
    const ny = cornerCode(face.c[(ci+1) % 4]).ok[1] - co[1];
    const nz = cornerCode(face.c[(ci+1) % 4]).ok[2] - co[2];
    const px = cornerCode(face.c[(ci+3) % 4]).ok[0] - co[0];
    const py = cornerCode(face.c[(ci+3) % 4]).ok[1] - co[1];
    const pz = cornerCode(face.c[(ci+3) % 4]).ok[2] - co[2];
    const s1 = blockAtRef(wx + n[0] + nx, wy + n[1] + ny, wz + n[2] + nz).ok;
    const s2 = blockAtRef(wx + n[0] + px, wy + n[1] + py, wz + n[2] + pz).ok;
    let ao = 0;
    if (s1 !== 0) ao++;
    if (s2 !== 0) ao++;
    if (s1 === 0 && s2 === 0 &&
        blockAtRef(wx + n[0] + nx + px, wy + n[1] + ny + py, wz + n[2] + nz + pz).ok !== 0)
      ao++;
    return { ok: AO_CURVE[ao], error: null };
  }

  function buildGreedyMesh(){
    const W = 64, H = 48, D = 64;
    const verts = [];
    const mask = new Uint8Array(64 * 64);
    const visited = new Uint8Array(64 * 64);
    for (let f = 0; f < 6; f++){
      const face = FACES[f];
      const n = face.n;
      const fixedAxis = n[0] !== 0 ? 0 : n[1] !== 0 ? 1 : 2;
      const fixedSign = n[fixedAxis];
      const pa = PLANE_AXES[fixedAxis];
      let pa1 = pa[0], pa2 = pa[1];
      if (fixedSign < 0){ const tmp = pa1; pa1 = pa2; pa2 = tmp; }
      const dims = [W, H, D];
      const faLen = dims[fixedAxis];
      const a1Len = dims[pa1], a2Len = dims[pa2];
      for (let fp = 0; fp < faLen; fp++){
        for (let a2 = 0; a2 < a2Len; a2++){
          for (let a1 = 0; a1 < a1Len; a1++){
            const pos = [0, 0, 0];
            pos[fixedAxis] = fp;
            pos[pa1] = a1;
            pos[pa2] = a2;
            const t = blockAtRef(pos[0], pos[1], pos[2]).ok;
            const nt = blockAtRef(pos[0] + n[0], pos[1] + n[1], pos[2] + n[2]).ok;
            mask[a2 * a1Len + a1] = (t !== 0 && nt === 0) ? t : 0;
          }
          for (let i = 0; i < a1Len * a2Len; i++) visited[i] = 0;
          for (let y = 0; y < a2Len; y++){
            for (let x = 0; x < a1Len; x++){
              const mi = y * a1Len + x;
              const t = mask[mi];
              if (t === 0 || visited[mi]) continue;
              let w = 1;
              while (x + w < a1Len && !visited[y * a1Len + x + w] &&
                     mask[y * a1Len + x + w] === t) w++;
              let h = 1;
              outer: for (let yy = y + 1; yy < a2Len; yy++){
                for (let k = 0; k < w; k++){
                  const ci = yy * a1Len + x + k;
                  if (visited[ci] || mask[ci] !== t) break outer;
                }
                h++;
              }
              for (let yy = y; yy < y + h; yy++)
                for (let k = 0; k < w; k++) visited[yy * a1Len + x + k] = 1;
              const fWorld = fp + (fixedSign > 0 ? 1 : 0);
              for (let ci = 0; ci < 4; ci++){
                  const cp = [0, 0, 0];
                cp[fixedAxis] = fWorld;
                cp[pa1] = x + ((ci === 1 || ci === 2) ? w : 0);
                cp[pa2] = y + ((ci === 2 || ci === 3) ? h : 0);
                const ao = aoLevel(cp[0], cp[1], cp[2], f, ci).ok;
                verts.push(cp[0], cp[1], cp[2], n[0], n[1], n[2],
                  (ci === 1 || ci === 2) ? w : 0,
                  (ci === 2 || ci === 3) ? h : 0, ao, t);
              }
              quadCount++;
            }
          }
        }
      }
    }
    vertexData = new Float32Array(verts);
    {
      const nq = quadCount;
      const idx = new Uint32Array(nq * 6);
      for (let q = 0; q < nq; q++){
        const b = q * 4, o = q * 6;
        idx[o] = b; idx[o + 1] = b + 1; idx[o + 2] = b + 2;
        idx[o + 3] = b; idx[o + 4] = b + 2; idx[o + 5] = b + 3;
      }
      quadIndexData = idx;
    }
    return { ok: { quadCount: quadCount }, error: null };
  }

  /* ---- WebGL (A1_total) ---- */
  const canvas = document.getElementById('glcanvas');
  function initWebGL(){
    gl = canvas.getContext('webgl2', { alpha: false, depth: true, antialias: true });
    if (!gl){ showErr('WebGL2 not supported'); return { ok: false, error: 'webgl2 unavailable' }; }
    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.CULL_FACE);
    gl.cullFace(gl.BACK);
    gl.frontFace(gl.CCW);
    gl.clearColor(0.102, 0.165, 0.227, 1.0);
    return { ok: true, error: null };
  }
  function onContextLost(e){
    e.preventDefault();
    webglContextLost = true;
    gl = null;
    showErr('WebGL context lost \u2014 GPU reset or tab suspended');
    return { ok: true, error: null };
  }
  function onContextRestored(){
    webglContextLost = false;
    if (!initWebGL().ok) return { ok: false, error: 'context restore failed' };
    showErr('WebGL context restored \u2014 reload page to re-render arena');
    return { ok: true, error: null };
  }
  canvas.addEventListener('webglcontextlost', onContextLost, false);
  canvas.addEventListener('webglcontextrestored', onContextRestored, false);
  function resizeGL(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth * dpr, h = window.innerHeight * dpr;
    if (canvas.width !== w || canvas.height !== h){
      canvas.width = w;
      canvas.height = h;
    }
    if (gl) gl.viewport(0, 0, canvas.width, canvas.height);
    return { ok: true, error: null };
  }
  window.addEventListener('resize', resizeGL);

  const VS = `#version 300 es
precision highp float;
layout(location = 0) in vec3 aPos;
layout(location = 1) in vec3 aNormal;
layout(location = 2) in vec2 aUV;
layout(location = 3) in float aAO;
layout(location = 4) in float aType;
uniform mat4 uModel;
uniform mat4 uView;
uniform mat4 uProj;
out vec3 vNormal; out vec2 vUV; out float vAO; out float vType; out vec3 vFragPos;
void main(){
  vec4 worldPos = uModel * vec4(aPos, 1.0);
  vFragPos = worldPos.xyz;
  vNormal = aNormal; vUV = aUV; vAO = aAO; vType = aType;
  gl_Position = uProj * uView * worldPos;
}`;
  const FS = `#version 300 es
precision highp float;
in vec3 vNormal; in vec2 vUV; in float vAO; in float vType; in vec3 vFragPos;
uniform vec3 uLightDir; uniform vec3 uLightColor; uniform vec3 uAmbientColor;
uniform vec3 uCamPos;
uniform vec4 uPalette[6];
out vec4 fragColor;
void main(){
  vec3 N = normalize(vNormal);
  vec3 L = normalize(uLightDir);
  float diff = max(dot(N, L), 0.0);
  int t = int(vType + 0.5);
  vec3 base = uPalette[t].rgb;
  vec3 color = base * uAmbientColor + base * uLightColor * diff;
  color *= (0.5 + 0.5 * vAO);
  float fogDist = min(length(vFragPos - uCamPos) / 48.0, 1.0);
  vec3 fogColor = vec3(0.102, 0.165, 0.227);
  color = mix(color, fogColor, fogDist * fogDist);
  fragColor = vec4(color, 1.0);
}`;
  let uModelLoc, uViewLoc, uProjLoc, uLightDirLoc, uLightColorLoc,
      uAmbientColorLoc, uPaletteLoc, uCamPosLoc;
  let vertexVBO, indexVBO;

  function createShader(type, source){
    const s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
      showErr('Shader compile: ' + (gl.getShaderInfoLog(s) || '(empty)'));
      gl.deleteShader(s);
      return { ok: false, error: 'shader compile failed', shader: null };
    }
    return { ok: true, error: null, shader: s };
  }
  function createProgram(vs, fs){
    const p = gl.createProgram();
    gl.attachShader(p, vs); gl.attachShader(p, fs);
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)){
      showErr('Program link: ' + (gl.getProgramInfoLog(p) || '(empty)'));
      return { ok: false, error: 'program link failed', program: null };
    }
    return { ok: true, error: null, program: p };
  }
  function initGLResources(){
    const vsr = createShader(gl.VERTEX_SHADER, VS);
    if (!vsr.ok) return { ok: false, error: vsr.error };
    const fsr = createShader(gl.FRAGMENT_SHADER, FS);
    if (!fsr.ok) return { ok: false, error: fsr.error };
    const pr = createProgram(vsr.shader, fsr.shader);
    if (!pr.ok) return { ok: false, error: pr.error };
    program = pr.program;
    gl.useProgram(program);
    uModelLoc = gl.getUniformLocation(program, 'uModel');
    uViewLoc = gl.getUniformLocation(program, 'uView');
    uProjLoc = gl.getUniformLocation(program, 'uProj');
    uLightDirLoc = gl.getUniformLocation(program, 'uLightDir');
    uLightColorLoc = gl.getUniformLocation(program, 'uLightColor');
    uAmbientColorLoc = gl.getUniformLocation(program, 'uAmbientColor');
    uPaletteLoc = gl.getUniformLocation(program, 'uPalette');
  uCamPosLoc = gl.getUniformLocation(program, 'uCamPos');
    gl.uniform3f(uLightDirLoc, 0.5, 0.5, -0.8);
    gl.uniform3f(uLightColorLoc, 1.0, 1.0, 0.9);
    gl.uniform3f(uAmbientColorLoc, 0.34, 0.34, 0.40);
    const palette = new Float32Array([
      0, 0, 0, 0,
      0.365, 0.251, 0.227, 1,
      0.471, 0.565, 0.616, 1,
      0.475, 0.333, 0.282, 1,
      1.0, 0.322, 0.322, 1,
      0, 0.737, 0.820, 1
    ]);
    gl.uniform4fv(uPaletteLoc, palette);
    const stride = VERT_FLOATS * 4;
    vertexVBO = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vertexVBO);
    gl.bufferData(gl.ARRAY_BUFFER, vertexData, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.enableVertexAttribArray(1);
    gl.enableVertexAttribArray(2);
    gl.enableVertexAttribArray(3);
    gl.enableVertexAttribArray(4);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, stride, 0);
    gl.vertexAttribPointer(1, 3, gl.FLOAT, false, stride, 12);
    gl.vertexAttribPointer(2, 2, gl.FLOAT, false, stride, 24);
    gl.vertexAttribPointer(3, 1, gl.FLOAT, false, stride, 32);
    gl.vertexAttribPointer(4, 1, gl.FLOAT, false, stride, 36);
    indexVBO = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexVBO);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, quadIndexData, gl.STATIC_DRAW);
    return { ok: true, error: null };
  }

  /* ---- write INPUT block for the coming substep (A1_total) ---- */
  function writeInput(dt){
    const cf = Math.cos(playerPitch), sf = Math.sin(playerPitch);
    const cy = Math.sin(playerYaw), sy = Math.cos(playerYaw);
    const fwd = { x: cy * cf, z: -sy * cf };
    let keysBits = 0;
    if (keys['KeyW'] || keys['ArrowUp']) keysBits |= 1;
    if (keys['KeyS'] || keys['ArrowDown']) keysBits |= 2;
    if (keys['KeyA'] || keys['ArrowLeft']) keysBits |= 4;
    if (keys['KeyD'] || keys['ArrowRight']) keysBits |= 8;
    I32[IB + 0] = keysBits;
    I32[IB + 1] = mouse.dx | 0;
    I32[IB + 2] = mouse.dy | 0;
    I32[IB + 3] = (mouse.buttons & 1) | (keys['Space'] ? 1 : 0);
    F32[IB + 4] = dt;
    F32[IB + 5] = fwd.x;
    F32[IB + 6] = fwd.z;
    F32[IB + 7] = fwd.x;
    F32[IB + 8] = sf;
    F32[IB + 9] = fwd.z;
    mouse.dx = 0; mouse.dy = 0;
    return { ok: true, error: null };
  }

  /* ---- read PLAYER + GLOBALS (A1_total) ---- */
  function readPlayer(){
    return { ok: {
      x: F32[PB + 0], y: F32[PB + 1], z: F32[PB + 2],
      vx: F32[PB + 3], vy: F32[PB + 4], vz: F32[PB + 5],
      yaw: F32[PB + 6], pitch: F32[PB + 7],
      hp: I32[PB + 9]
    }, error: null };
  }
  function readGlobals(){
    return { ok: { score: I32[GW + 0], wave: I32[GW + 1],
                 alive: I32[GW + 2], kills: I32[GW + 3] }, error: null };
  }

  function spawnPlayer(){
    const gy = ex.groundAt(32, 32);
    F32[PB + 0] = 32.5; F32[PB + 1] = gy; F32[PB + 2] = 32.5;
    F32[PB + 3] = 0; F32[PB + 4] = 0; F32[PB + 5] = 0;
    F32[PB + 6] = 0; F32[PB + 7] = 0; F32[PB + 8] = 0;
    I32[PB + 9] = 100; I32[PB + 10] = 0;
    I32[PB + 11] = 12; I32[PB + 12] = 6; I32[PB + 13] = 4;
    I32[PB + 14] = 1;
    F32[PB + 15] = 0;
    return { ok: true, error: null };
  }

  /* ---- load wasm kernel (A1_total) ---- */
  async function loadWasm(){
    try {
      const ready = wasmReady();
      if (!ready.ok) return { ok: false, error: ready.error };
      /* SUN_001 monolith: kernel embedded as WASM_B64 (no fetch) */
      const b64 = atob(WASM_B64);
      const bytes = new Uint8Array(b64.length);
      for (let i = 0; i < b64.length; i++) bytes[i] = b64.charCodeAt(i);
      const res = lib.instantiateWasmBytes(bytes);
      if (!res.ok) return { ok: false, error: 'instantiate: ' + JSON.stringify(res.error) };
      ex = res.instance.exports;
      mem = ex.mem;
      if (typeof ex.selfTest !== 'function' || ex.selfTest() !== 0)
        return { ok: false, error: 'kernel selfTest failed' };
      const buf = mem.buffer;
      U8 = new Uint8Array(buf);
      I32 = new Int32Array(buf);
      F32 = new Float32Array(buf);
      arenaU8 = new Uint8Array(buf, REGION.ARENA, 196608);
      return { ok: true, error: null };
    } catch (err){
      return { ok: false, error: 'loadWasm exception: ' + String(err) };
    }
  }

  /* ---- main loop (A1_total; box_ui on error) ---- */
  let lastTime = performance.now();
  let frameCount = 0, fpsTime = performance.now(), fps = 0;
  let gameStarted = false;
  const FIXED_DT = 1000 / 60, MAX_STEPS = 5;
  let simAcc = 0;
  const SHOT_MODE = new URLSearchParams(location.search).get('shot') === '1';

  function loop(){
    try {
      const now = performance.now();
      let frameMs = Math.min(now - lastTime, 250);
      lastTime = now;
      frameCount++;
      if (now - fpsTime >= 1000){ fps = frameCount; frameCount = 0; fpsTime = now; }

      if (webglContextLost || !gl){
        requestAnimationFrame(loop);
        return { ok: true, error: null };
      }

      const tRender0 = performance.now();
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      if (!gameStarted){
        requestAnimationFrame(loop);
        return { ok: true, error: null };
      }

      const tSim0 = performance.now();
      simAcc += frameMs;
      let droppedMs = 0;
      let steps = 0;
      while (simAcc >= FIXED_DT && steps < MAX_STEPS){
        writeInput(FIXED_DT / 1000);
        ex.frame(FIXED_DT / 1000);
        simAcc -= FIXED_DT;
        steps++;
      }
      if (simAcc >= FIXED_DT){
        droppedMs = simAcc - FIXED_DT;
        simAcc = FIXED_DT;
      }
      const tSim1 = performance.now();

      const p = readPlayer().ok;
      playerYaw = p.yaw;
      playerPitch = p.pitch;
      const g = readGlobals().ok;
      const camX = p.x;
      const camY = p.y + EYE_H;
      const camZ = p.z;

      const cf = Math.cos(playerPitch), sf = Math.sin(playerPitch);
      const cy = Math.sin(playerYaw), sy = Math.cos(playerYaw);
      const fx = cy * cf, fy = sf, fz = -sy * cf;
      const eye = [camX, camY, camZ];
      const center = [eye[0] + fx, eye[1] + fy, eye[2] + fz];
      const viewMat = m4LookAt(eye, center, [0, 1, 0]).ok;
      const projMat = m4Perspective(FOV, canvas.width / canvas.height, NEAR, FAR).ok;

      gl.useProgram(program);
      gl.uniformMatrix4fv(uViewLoc, false, viewMat);
      gl.uniformMatrix4fv(uProjLoc, false, projMat);
      gl.uniformMatrix4fv(uModelLoc, false, m4Identity().ok);
      gl.uniform3f(uCamPosLoc, camX, camY, camZ);

      const tDraw0 = performance.now();
      if (quadCount > 0){
        gl.bindBuffer(gl.ARRAY_BUFFER, vertexVBO);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexVBO);
        gl.drawElements(gl.TRIANGLES, quadCount * 6, gl.UNSIGNED_INT, 0);
      }
      const tDraw1 = performance.now();
      const tRender1 = performance.now();

      document.getElementById('hudWave').textContent = g.wave;
      document.getElementById('hudKills').textContent = g.kills;
      document.getElementById('hudScore').textContent = g.score;
      document.getElementById('hudPos').textContent =
        Math.floor(p.x) + ', ' + Math.floor(p.y) + ', ' + Math.floor(p.z);
      document.getElementById('perfFrameMs').textContent = (tRender1 - tRender0).toFixed(2);
      document.getElementById('perfSimMs').textContent = (tSim1 - tSim0).toFixed(2);
      document.getElementById('perfDrawMs').textContent = (tDraw1 - tDraw0).toFixed(2);
      document.getElementById('perfDropped').textContent = droppedMs.toFixed(0);
      document.getElementById('perfFps').textContent = fps;

      requestAnimationFrame(loop);
      return { ok: true, error: null };
    } catch (e){
      console.error('loop error:', e && e.message);
      showErr('LOOP ERROR: ' + (e && e.message));
      requestAnimationFrame(loop);
      return { ok: true, error: null };
    }
  }

  /* ---- boot (A1_total; box_ui on error) ---- */
  async function boot(){
    try {
      const lr = await loadWasm();
      if (!lr.ok){ showErr('WASM kernel load failed: ' + lr.error); return { ok: false, error: lr.error }; }
      if (!initWebGL().ok){ showErr('WebGL2 init failed'); return { ok: false, error: 'webgl2 unavailable' }; }
      resizeGL();
      ex.init(12345);
      ex.genArena(12345);
      const sp = spawnPlayer();
      if (!sp.ok){ showErr('Player spawn failed: ' + sp.error); return { ok: false, error: sp.error }; }
      const gm = buildGreedyMesh();
      if (!gm.ok){ showErr('Greedy mesh build failed: ' + gm.error); return { ok: false, error: gm.error }; }
      if (!initGLResources().ok){ showErr('GL resources failed'); return { ok: false, error: 'gl resources failed' }; }

      document.getElementById('overlayBtn').addEventListener('click', () => {
        gameStarted = true;
        document.getElementById('overlay').classList.add('hidden');
        try { canvas.requestPointerLock(); } catch (e) {}
      });
      document.getElementById('overlayBtn').addEventListener('keydown', (e) => {
        if (e.code === 'Enter' || e.code === 'Space'){
          e.preventDefault();
          gameStarted = true;
          document.getElementById('overlay').classList.add('hidden');
          try { canvas.requestPointerLock(); } catch (e) {}
        }
      });
      if (SHOT_MODE){
        gameStarted = true;
        document.getElementById('overlay').classList.add('hidden');
      }
      lastTime = performance.now();
      loop();
      return { ok: true, error: null };
    } catch (e){
      showErr('BOOT ERROR: ' + (e && e.message));
      return { ok: false, error: 'boot exception: ' + String(e) };
    }
  }
  boot();
})();
</script>
