<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SUN_004 · REDBOLT — neon arena FPS</title>
<title>SUN_005 · REDBOLT — neon arena FPS</title>
<style>
:root{
  --bg:#070b16; --bg2:#0a0e1a; --surface:#111a30; --surface2:#16223e; --overlay:rgba(8,12,24,.82);
  --cyan:#22e0ff; --cyan-d:#0a86b8; --red:#ff3b30; --orange:#ff6a2b; --green:#5dff8b; --amber:#ffb020;
  --magenta:#b061ff; --pink:#ff4dd8; --ink:#eaf6ff; --muted:#8aa0c0; --line:rgba(34,224,255,.22);
  --good:#5dff8b; --warn:#ffb020; --bad:#ff3b30; --info:#22e0ff;
  --mono:ui-monospace,"SFMono-Regular","Cascadia Code","Consolas","Menlo",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{position:fixed;inset:0;touch-action:none}
.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(120% 100% at 50% 40%,rgba(8,12,24,.72),rgba(5,8,16,.9))}
.overlay.hidden{display:none}
.panel{width:min(680px,94vw);max-height:92vh;overflow:auto;border:1px solid var(--line);border-radius:18px;
  background:linear-gradient(165deg,rgba(22,34,62,.92),rgba(10,14,26,.94));
  box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 60px rgba(34,224,255,.08) inset;padding:30px 30px 26px;position:relative}
.panel::before{content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;
  background:linear-gradient(120deg,rgba(34,224,255,.12),transparent 30%,transparent 70%,rgba(255,59,48,.12))}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.4em;color:var(--cyan);margin-bottom:10px}
.title{font-family:var(--mono);font-weight:800;font-size:clamp(34px,8vw,60px);line-height:.95;letter-spacing:.02em;margin:0 0 6px}
.title .r{color:var(--red);text-shadow:0 0 26px rgba(255,59,48,.55)}
.title .c{color:var(--cyan);text-shadow:0 0 26px rgba(34,224,255,.45)}
.tagline{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 22px;max-width:52ch}
.tagline{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 8px;max-width:52ch}
.ver{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--cyan);margin:0 0 20px;opacity:.75}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 22px}
/* high scores */
#hsWrap{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.hs-title{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--cyan);margin-bottom:8px}
#hsList{font-family:var(--mono);font-size:11.5px;line-height:1.85;color:var(--muted);white-space:pre-wrap;word-break:break-word}
#hsList .top{color:var(--amber)}
#hsList .empty{color:var(--muted);letter-spacing:.14em}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;font-family:var(--mono);font-size:12px;padding:9px 4px;background:transparent;color:var(--muted);border:0;cursor:pointer;transition:.15s}
.seg button.on{background:linear-gradient(180deg,rgba(34,224,255,.22),rgba(34,224,255,.08));color:var(--ink);text-shadow:0 0 8px rgba(34,224,255,.5)}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--cyan),var(--magenta));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--ink);border:2px solid var(--cyan);box-shadow:0 0 10px rgba(34,224,255,.6);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--ink);border:2px solid var(--cyan);cursor:pointer}
.btnrow{display:flex;gap:12px;flex-wrap:wrap}
.btn{font-family:var(--mono);font-weight:700;letter-spacing:.12em;font-size:15px;padding:15px 26px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:.16s;flex:1;min-width:160px}
.btn.primary{color:#04121a;background:linear-gradient(100deg,var(--cyan),#7af0ff);box-shadow:0 10px 30px rgba(34,224,255,.3)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(34,224,255,.45)}
#benchPanel.on{display:block}
.bench-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.badge{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.1em;padding:5px 12px;border-radius:20px}
.badge.pass{color:#04121a;background:var(--green)}
.badge.fail{color:#fff;background:var(--red)}
.badge.run{color:#04121a;background:var(--amber)}
.bench-count{font-family:var(--mono);font-size:12px;color:var(--muted)}
#benchScroll{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:rgba(4,8,16,.7);padding:12px}
#benchmarkPre{font-family:var(--mono);font-size:11.5px;line-height:1.7;margin:0;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
#benchmarkPre .p{color:var(--green)}#benchmarkPre .f{color:var(--red)}#benchmarkPre .s{color:var(--amber)}#benchmarkPre .t{color:var(--pink)}
#copyResultsBtn{display:none;margin-top:12px}
#copyResultsBtn.on{display:inline-flex}
#exportBtn{margin-top:12px}
/* game over */
.go-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:6px 0 24px}
.go-stat{border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;background:rgba(7,11,22,.5)}
.go-stat .v{font-family:var(--mono);font-size:26px;font-weight:800;color:var(--amber)}
.go-stat .k{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--muted);margin-top:4px}
/* mobile controls */
#touch{position:fixed;inset:0;z-index:15;pointer-events:none;display:none}
#touch.on{display:block}
#stick{position:absolute;left:24px;bottom:calc(30px + env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;
  border:2px solid var(--line);background:rgba(17,26,48,.4);pointer-events:auto}
#stickNub{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 35% 30%,rgba(34,224,255,.6),rgba(34,224,255,.15));border:1px solid var(--cyan)}
}
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>
<div id="bgfx"></div>
<div id="gridfx"></div>
<div id="vignette"></div>
<div id="damage"></div>
<div id="lowhp"></div>

<div id="topbar">
  <span class="brand">SUN_004 · <b>REDBOLT</b></span>
  <span class="brand">SUN_005 · <b>REDBOLT</b></span>
  <span class="spacer"></span>
  <button id="muteBtn" class="iconbtn" title="Toggle sound"><span class="dot"></span><span id="muteLbl">SOUND ON</span></button>
  <button id="pauseBtn" class="iconbtn" style="display:none">PAUSE</button>
</div>

<div id="hud">
  <div class="hud-top">
    <div class="stat" id="hudScore"><span class="lbl">SCORE</span><span class="val" id="scoreVal">0</span></div>
